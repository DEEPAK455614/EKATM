name: EKATM CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ysxmumnbhlwiylmqzjpy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FnFXHJqC1ddt9DYgYQDLvg_OICuYe-u
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekatm-build-log
          path: build.log
          if-no-files-found: ignore
