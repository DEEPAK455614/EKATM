name: Switch survey version
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy
        type: choice
        required: true
        options:
          - current
          - previous
permissions:
  contents: write
concurrency:
  group: survey-version-switch
  cancel-in-progress: false
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore selected release without rewriting history
        env:
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          case "$SELECTED_VERSION" in
            current) target=origin/release/survey-1.3 ;;
            previous) target=origin/release/survey-1.2-before-field-update ;;
            *) exit 1 ;;
          esac
          cp .github/workflows/switch-survey-version.yml /tmp/switch-survey-version.yml
          git read-tree --reset -u "$target"
          mkdir -p .github/workflows
          cp /tmp/switch-survey-version.yml .github/workflows/switch-survey-version.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m "Switch survey to $SELECTED_VERSION release"
          git push origin HEAD:main
